baseURL = 'https://sereja.tech/'
languageCode = 'ru'
title = 'Сережа Рис'
defaultContentLanguage = 'ru'
enableRobotsTXT = true
enableGitInfo = true

[taxonomies]
  tag = "tags"

[permalinks]
  blog = '/blog/:contentbasename'

[params]
  author = 'Сережа Рис'
  description = 'Статьи про вайбкодинг, Claude Code и AI-инструменты'
  twitter = '@riiiiiiiiss'

  # Hand-built pages in static/<slug>/: Hugo does not see them, so list them for sitemap.xml and llms.txt
  [[params.standalone]]
    url = 'vy-absolyutno-pravy/'
    title = '«Вы абсолютно правы»: клип силами агентов за три часа'
    description = 'Гайд: как агенты в Claude Code сделали русский кавер с клипом и где решает человек'
    lastmod = '2026-09-27'

  [[params.standalone]]
    url = 'pelican-na-velosipede/'
    title = 'Пеликан на велосипеде: 28 прогонов в Codex и Claude Code'
    description = 'Тест Саймона Уиллисона на шести моделях и четырёх уровнях эффорта: сетка, анимации, время, токены и как повторить'
    lastmod = '2026-09-29'

  [[params.standalone]]
    url = 'kak-rasshifrovat-video-i-audio/'
    title = 'Как расшифровать видео и аудио: на своём Mac или через API'
    description = 'Как расшифровать видео и аудио на своём Mac или через API: цена часа, точность терминов и конспект. Замер на русской речи с английскими терминами.'
    lastmod = '2026-09-30'

  [[params.standalone]]
    url = 'kak-agent-vedet-dela/'
    title = 'Как агент ведёт мои дела: daily, manager, retro'
    description = 'Утром /daily, после разговора /manager, в воскресенье /retro: список дел ведёт агент, а вы только запускаете команду.'
    lastmod = '2026-10-01'

  [[params.standalone]]
    url = 'pochemu-agent-ne-slushaetsya-pravil/'
    title = 'Файл правил: как написать его, чтобы агент слушался'
    description = 'Чем длиннее файл правил, тем хуже агент его соблюдает. Как устроить AGENTS.md и скиллы для Claude Code, Codex и Cursor: четыре мерила, примеры и проверка своей папки.'
    lastmod = '2026-10-04'

  [[params.standalone]]
    url = 'kak-doverit-agentam-kod/'
    title = 'Как доверить агентам код: pstack Лорен Тан'
    description = 'Гайд: как Лорен Тан ведёт PR агентами в pstack, где решает человек и что из этого работает в Claude Code'
    lastmod = '2026-10-04'

  [[params.standalone]]
    url = 'kak-derzhat-odni-skilly-vo-vseh-agentah/'
    title = 'Как держать одни скиллы во всех агентах'
    description = 'Гайд: один оригинал скилла и симлинки в Claude Code, Codex, opencode, Copilot, Cursor и Gemini CLI, где схема спотыкается и какие менеджеры скиллов уже есть'
    lastmod = '2026-10-04'

  [[params.standalone]]
    url = 'kak-proverit-neyroset/'
    title = 'Эвалы: как проверить нейросеть на своей задаче'
    description = 'Гайд: почему модель выдаёт чужой опыт за совет, что из работы отдать программе и какую модель брать для конспектов встреч, сводок и протоколов.'
    lastmod = '2026-10-02'

  [[params.standalone]]
    url = 'kak-proverit-servis-na-dyry/'
    title = 'Безопасность: как проверить свой сервис на дыры'
    description = 'Гайд: закрытая база, второй аккаунт, секреты в браузере, ревью по перечню и постоянный гейт. Как за вечер закрыть самые дешёвые дыры вайбкодинг-сервиса.'
    lastmod = '2026-10-02'

  [[params.standalone]]
    url = 'frontend-s-agentami/'
    title = 'Фронтенд с агентами: одни компоненты вместо зоопарка'
    description = 'Гайд: как агенты нарастили в LMS пятнадцать разных кнопок и как вернуть порядок: один набор компонентов, Storybook по правилам и проверка глазами.'
    lastmod = '2026-10-08'

  # Social links for JSON-LD sameAs
  [[params.social]]
    name = 'twitter'
    url = 'https://x.com/riiiiiiiiss'
  [[params.social]]
    name = 'telegram'
    url = 'https://t.me/ris_ai'
  [[params.social]]
    name = 'youtube'
    url = 'https://www.youtube.com/@serejaris'
  [[params.social]]
    name = 'community'
    url = 'https://t.me/vibecod3rs'
  [[params.social]]
    name = 'github'
    url = 'https://github.com/serejaris'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    style = 'github'

[outputFormats.LLMS]
  baseName = 'llms'
  mediaType = 'text/plain'
  isPlainText = true

[outputFormats.LLMS-FULL]
  baseName = 'llms-full'
  mediaType = 'text/plain'
  isPlainText = true

[outputFormats.SearchIndex]
  baseName = 'searchindex'
  mediaType = 'application/json'

[outputs]
  home = ['HTML', 'RSS', 'LLMS', 'LLMS-FULL', 'SearchIndex']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML']
  term = ['HTML']

[sitemap]
  changefreq = ''
  priority = -1

[related]
  threshold = 80
  includeNewer = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10
