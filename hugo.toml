baseURL = 'https://sereja.tech/'
languageCode = 'ru'
title = 'Сережа Рис'
defaultContentLanguage = 'ru'
enableRobotsTXT = true
enableGitInfo = true

[taxonomies]
  tag = "tags"

[permalinks]
  blog = '/blog/:contentbasename'

[params]
  author = 'Сережа Рис'
  description = 'Статьи про вайбкодинг, Claude Code и AI-инструменты'
  twitter = '@riiiiiiiiss'

  # Hand-built pages in static/<slug>/: Hugo does not see them, so list them for sitemap.xml and llms.txt
  [[params.standalone]]
    url = 'vy-absolyutno-pravy/'
    title = '«Вы абсолютно правы»: клип силами агентов за три часа'
    description = 'Гайд: как агенты в Claude Code сделали русский кавер с клипом и где решает человек'
    lastmod = '2026-09-27'

  [[params.standalone]]
    url = 'pelican-na-velosipede/'
    title = 'Пеликан на велосипеде: 28 прогонов в Codex и Claude Code'
    description = 'Тест Саймона Уиллисона на шести моделях и четырёх уровнях эффорта: сетка, анимации, время, токены и как повторить'
    lastmod = '2026-09-29'

  [[params.standalone]]
    url = 'kak-rasshifrovat-video-i-audio/'
    title = 'Как расшифровать видео и аудио: на своём Mac или через API'
    description = 'Как расшифровать видео и аудио на своём Mac или через API: цена часа, точность терминов и конспект. Замер на русской речи с английскими терминами.'
    lastmod = '2026-09-30'

  # Social links for JSON-LD sameAs
  [[params.social]]
    name = 'twitter'
    url = 'https://x.com/riiiiiiiiss'
  [[params.social]]
    name = 'telegram'
    url = 'https://t.me/ris_ai'
  [[params.social]]
    name = 'youtube'
    url = 'https://www.youtube.com/@serejaris'
  [[params.social]]
    name = 'community'
    url = 'https://t.me/vibecod3rs'
  [[params.social]]
    name = 'github'
    url = 'https://github.com/serejaris'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    style = 'github'

[outputFormats.LLMS]
  baseName = 'llms'
  mediaType = 'text/plain'
  isPlainText = true

[outputFormats.LLMS-FULL]
  baseName = 'llms-full'
  mediaType = 'text/plain'
  isPlainText = true

[outputFormats.SearchIndex]
  baseName = 'searchindex'
  mediaType = 'application/json'

[outputs]
  home = ['HTML', 'RSS', 'LLMS', 'LLMS-FULL', 'SearchIndex']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML']
  term = ['HTML']

[sitemap]
  changefreq = ''
  priority = -1

[related]
  threshold = 80
  includeNewer = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10
