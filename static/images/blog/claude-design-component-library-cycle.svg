<svg viewBox="0 0 740 560" role="img" aria-labelledby="library-cycle-title library-cycle-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="library-cycle-title">Управляемый цикл общей библиотеки React и Claude Design</title>
  <desc id="library-cycle-desc">Шесть шагов замкнутого цикла. Библиотека React и токены хранятся в Git. Команда design-sync обновляет систему в Claude Design. Макет передаётся в Claude Code через design. Изменения выполняются в отдельной ветке. Состояния проверяются в Storybook и браузере. Только принятые изменения возвращаются в библиотеку, после чего цикл синхронизации повторяется. Непринятые изменения возвращаются на доработку.</desc>

  <defs>
    <marker id="library-cycle-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284c7" />
    </marker>
    <marker id="library-cycle-arrow-indigo" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1c4e80" />
    </marker>
    <marker id="library-cycle-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

  <rect width="740" height="560" fill="#f8fafc" />

  <!-- Logical areas -->
  <rect x="244" y="38" width="472" height="154" rx="8" fill="#0284c7" fill-opacity="0.025" stroke="#0284c7" stroke-opacity="0.16" stroke-width="0.8" />
  <rect x="550" y="32" width="116" height="14" rx="2" fill="#f8fafc" />
  <text x="608" y="42" fill="#64748b" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">МАКЕТ</text>

  <rect x="12" y="294" width="704" height="154" rx="8" fill="#1c4e80" fill-opacity="0.025" stroke="#1c4e80" stroke-opacity="0.14" stroke-width="0.8" />
  <rect x="542" y="288" width="132" height="14" rx="2" fill="#f8fafc" />
  <text x="608" y="298" fill="#64748b" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">КОД И ПРОВЕРКА</text>

  <!-- Node 1: source of truth -->
  <rect x="24" y="72" width="198" height="88" rx="6" fill="#ffffff" stroke="#1c4e80" stroke-width="1.3" />
  <rect x="38" y="84" width="92" height="16" rx="2" fill="#1c4e80" fill-opacity="0.09" stroke="#1c4e80" stroke-opacity="0.38" stroke-width="0.8" />
  <text x="84" y="95.5" fill="#1c4e80" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">01 КАНОН</text>
  <text x="38" y="124" fill="#0f172a" font-size="17" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Библиотека React</text>
  <text x="38" y="146" fill="#475569" font-size="12" font-family="'PT Mono', ui-monospace, monospace">компоненты + токены в Git</text>

  <!-- Node 2: sync -->
  <rect x="271" y="72" width="198" height="88" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
  <rect x="285" y="84" width="92" height="16" rx="2" fill="#0284c7" fill-opacity="0.08" stroke="#0284c7" stroke-opacity="0.38" stroke-width="0.8" />
  <text x="331" y="95.5" fill="#0284c7" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">02 ЗАГРУЗКА</text>
  <text x="285" y="124" fill="#0f172a" font-size="17" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">/design-sync</text>
  <text x="285" y="146" fill="#475569" font-size="12" font-family="'PT Mono', ui-monospace, monospace">обновить систему</text>

  <!-- Node 3: visual design -->
  <rect x="518" y="72" width="198" height="88" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
  <rect x="532" y="84" width="92" height="16" rx="2" fill="#0284c7" fill-opacity="0.08" stroke="#0284c7" stroke-opacity="0.38" stroke-width="0.8" />
  <text x="578" y="95.5" fill="#0284c7" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">03 МАКЕТ</text>
  <text x="532" y="124" fill="#0f172a" font-size="17" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Claude Design</text>
  <text x="532" y="146" fill="#475569" font-size="12" font-family="'PT Mono', ui-monospace, monospace">макет на общей системе</text>

  <!-- Node 4: handoff -->
  <rect x="518" y="330" width="198" height="88" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
  <rect x="532" y="342" width="92" height="16" rx="2" fill="#0284c7" fill-opacity="0.08" stroke="#0284c7" stroke-opacity="0.38" stroke-width="0.8" />
  <text x="578" y="353.5" fill="#0284c7" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">04 ПЕРЕДАЧА</text>
  <text x="532" y="382" fill="#0f172a" font-size="17" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Передача в код</text>
  <text x="532" y="404" fill="#475569" font-size="12" font-family="'PT Mono', ui-monospace, monospace">/design в Claude Code</text>

  <!-- Node 5: branch -->
  <rect x="271" y="330" width="198" height="88" rx="6" fill="#ffffff" stroke="#1c4e80" stroke-width="1.2" />
  <rect x="285" y="342" width="92" height="16" rx="2" fill="#1c4e80" fill-opacity="0.09" stroke="#1c4e80" stroke-opacity="0.38" stroke-width="0.8" />
  <text x="331" y="353.5" fill="#1c4e80" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">05 ВЕТКА</text>
  <text x="285" y="382" fill="#0f172a" font-size="17" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Изменения</text>
  <text x="285" y="404" fill="#475569" font-size="12" font-family="'PT Mono', ui-monospace, monospace">компоненты и токены</text>

  <!-- Node 6: review gate -->
  <rect x="24" y="330" width="198" height="88" rx="6" fill="#ffffff" stroke="#1c4e80" stroke-width="1.4" />
  <rect x="38" y="342" width="92" height="16" rx="2" fill="#1c4e80" fill-opacity="0.09" stroke="#1c4e80" stroke-opacity="0.38" stroke-width="0.8" />
  <text x="84" y="353.5" fill="#1c4e80" font-size="9" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">06 ПРИЁМКА</text>
  <text x="38" y="382" fill="#0f172a" font-size="17" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">Проверка состояний</text>
  <text x="38" y="404" fill="#475569" font-size="12" font-family="'PT Mono', ui-monospace, monospace">Storybook + браузер</text>

  <!-- Main cycle: strictly orthogonal -->
  <path d="M222 116 H271" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#library-cycle-arrow-blue)" />
  <path d="M469 116 H518" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#library-cycle-arrow-blue)" />
  <path d="M617 160 V330" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#library-cycle-arrow-blue)" />
  <path d="M518 374 H469" fill="none" stroke="#1c4e80" stroke-width="1.5" marker-end="url(#library-cycle-arrow-indigo)" />
  <path d="M271 374 H222" fill="none" stroke="#1c4e80" stroke-width="1.5" marker-end="url(#library-cycle-arrow-indigo)" />
  <path d="M24 374 H12 Q4 374 4 366 V124 Q4 116 12 116 H24" fill="none" stroke="#1c4e80" stroke-width="1.5" marker-end="url(#library-cycle-arrow-indigo)" />

  <!-- Acceptance label masks the return connector -->
  <rect x="4" y="222" width="88" height="20" rx="2" fill="#f8fafc" />
  <text x="48" y="236" fill="#1c4e80" font-size="10" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ПРИНЯТО</text>

  <!-- Rework loop: rejected changes return to the branch -->
  <path d="M123 418 V464 Q123 472 131 472 H362 Q370 472 370 464 V418" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#library-cycle-arrow-muted)" />
  <rect x="204" y="462" width="84" height="20" rx="2" fill="#f8fafc" />
  <text x="246" y="476" fill="#64748b" font-size="10" font-family="'PT Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">НА ПРАВКИ</text>

  <!-- Compact legend -->
  <text x="24" y="532" fill="#94a3b8" font-size="9.5" font-family="'PT Mono', ui-monospace, monospace" letter-spacing="0.14em">ЛЕГЕНДА</text>
  <path d="M104 528 H140" fill="none" stroke="#0284c7" stroke-width="1.5" marker-end="url(#library-cycle-arrow-blue)" />
  <text x="150" y="532" fill="#64748b" font-size="10.5" font-family="'PT Mono', ui-monospace, monospace">передача</text>
  <path d="M252 528 H288" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#library-cycle-arrow-muted)" />
  <text x="298" y="532" fill="#64748b" font-size="10.5" font-family="'PT Mono', ui-monospace, monospace">возврат на правки</text>
  <rect x="448" y="518" width="22" height="16" rx="3" fill="#ffffff" stroke="#1c4e80" stroke-width="1.3" />
  <text x="480" y="532" fill="#64748b" font-size="10.5" font-family="'PT Mono', ui-monospace, monospace">ручная приёмка</text>
</svg>
