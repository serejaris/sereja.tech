  <text x="129" y="195" fill="#64748b" font-size="9.5" font-family="'PT Mono', Menlo, Monaco, monospace" text-anchor="middle">клиенты + экстракция смыслов</text>

  <!-- 1.3 Twitter / X -->
  <rect x="38" y="222" width="182" height="66" rx="6" fill="#ffffff" stroke="#1c4e80" stroke-width="1" />
  <rect x="46" y="229" width="76" height="13" rx="2" fill="rgba(28,78,128,0.08)" />
  <text x="84" y="239" fill="#1c4e80" font-size="8.5" font-family="'PT Mono', Menlo, Monaco, monospace" text-anchor="middle">AI-РАДАР</text>
  <text x="129" y="258" fill="#0f172a" font-size="12" font-family="system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">Тренды Twitter / X</text>
  <text x="129" y="275" fill="#64748b" font-size="9.5" font-family="'PT Mono', Menlo, Monaco, monospace" text-anchor="middle">фронтир моделей и утилит</text>

