<svg viewBox="0 0 980 540" role="img" aria-labelledby="diagram-title diagram-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="diagram-title">Архитектура Personal Corp OS: входящие потоки, утренний крон и витрина</title>
  <desc id="diagram-desc">Четырёхконтурная операционная архитектура: многоканальный сбор сырья, автономный утренний стендап агента, диспетчеризация отделов из HQ и выходная триада.</desc>
  
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1c4e80" />
    </marker>
  </defs>

  <!-- Фон полотна -->
  <rect width="980" height="540" fill="#f8fafc" rx="6" />

  <!-- СЛОЙ 1: Входящие потоки -->
  <rect x="24" y="24" width="210" height="474" rx="8" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.12)" stroke-width="1" />
  <text x="129" y="48" fill="#1c4e80" font-size="10" font-family="'PT Mono', Menlo, Monaco, monospace" font-weight="700" letter-spacing="0.1em" text-anchor="middle">1. ВХОДЯЩИЕ ПОТОКИ</text>

  <!-- 1.1 Granola -->
  <rect x="38" y="62" width="182" height="66" rx="6" fill="#ffffff" stroke="#1c4e80" stroke-width="1" />
  <rect x="46" y="69" width="76" height="13" rx="2" fill="rgba(28,78,128,0.08)" />
  <text x="84" y="79" fill="#1c4e80" font-size="8.5" font-family="'PT Mono', Menlo, Monaco, monospace" text-anchor="middle">ЖИВЫЕ ЗВОНКИ</text>
  <text x="129" y="98" fill="#0f172a" font-size="12" font-family="system-ui, -apple-system, sans-serif" font-weight="600" text-anchor="middle">Конспекты Granola</text>
  <text x="129" y="115" fill="#64748b" font-size="9.5" font-family="'PT Mono', Menlo, Monaco, monospace" text-anchor="middle">1-на-1, звонки, живая речь</text>

  <!-- 1.2 Telegram -->
  <rect x="38" y="142" width="182" height="66" rx="6" fill="#ffffff" stroke="#1c4e80" stroke-width="1" />
  <rect x="46" y="149" width="80" height="13" rx="2" fill="rgba(28,78,128,0.08)" />
  <text x="86" y="159" fill="#1c4e80" font-size="8.5" font-family="'PT Mono', Menlo, Monaco, monospace" text-anchor="middle">3 УРОВНЯ TELEGRAM</text>
