  <text x="772" y="184" fill="#94a3b8" font-size="11.5" font-family="'PT Mono', Menlo, Monaco, Consolas, monospace">ветка и пулреквест</text>

  <rect x="756" y="216" width="160" height="56" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1" />
  <text x="772" y="240" fill="#1e293b" font-size="15" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">Рассылки</text>
  <text x="772" y="260" fill="#94a3b8" font-size="11.5" font-family="'PT Mono', Menlo, Monaco, Consolas, monospace">очередь сообщений</text>

  <rect x="756" y="292" width="160" height="56" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1" />
  <text x="772" y="316" fill="#1e293b" font-size="15" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">Канал</text>
  <text x="772" y="336" fill="#94a3b8" font-size="11.5" font-family="'PT Mono', Menlo, Monaco, Consolas, monospace">посты и карточки</text>

