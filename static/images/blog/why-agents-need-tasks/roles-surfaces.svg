<svg viewBox="0 0 940 430" role="img" aria-labelledby="rs-title rs-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="rs-title">Задачи из списка штаба расходятся по ролям, роли сдают работу в поверхности</title>
  <desc id="rs-desc">KB: concepts/role-incarnation
Слева слой задач из списка штаба: починить оплату, страница сайта, отчёт продаж, сообщение клиентам, пост в канал. В середине четыре роли агентов, нанятые по брифам: аналитик, инженер, comms, писатель. Линии идут перекрёстно: инженер тянет сразу две задачи, оплату и страницу сайта. Отчёт продаж уходит вверх к аналитику через линии инженера, сообщение клиентам к comms, пост в канал к писателю. Справа поверхности: бот, сайт, рассылки, канал. Это репозитории и площадки без своего списка задач, куда роли сдают результат веткой и пулреквестом. Аналитик соединён с ботом пунктиром: он только читает данные и ничего в поверхность не пишет.</desc>

