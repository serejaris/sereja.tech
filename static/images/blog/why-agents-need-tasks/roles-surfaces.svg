  <text x="412" y="34" fill="#64748b" font-size="9.5" font-family="'PT Mono', Menlo, Monaco, Consolas, monospace" letter-spacing="0.14em">РОЛИ АГЕНТОВ · ПО БРИФАМ</text>
  <text x="740" y="34" fill="#64748b" font-size="9.5" font-family="'PT Mono', Menlo, Monaco, Consolas, monospace" letter-spacing="0.14em">ПОВЕРХНОСТИ · БЕЗ ЗАДАЧ</text>

