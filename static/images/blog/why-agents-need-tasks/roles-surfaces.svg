      <polygon points="0 0, 8 3, 0 6" fill="#1c4e80" />
    </marker>
    <marker id="rs-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

