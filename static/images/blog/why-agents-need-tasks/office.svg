  <path d="M604 363 H652" fill="none" stroke="#1c4e80" stroke-width="1.4" marker-end="url(#of-arrow-ink)" />
  <path d="M604 417 H652" fill="none" stroke="#1c4e80" stroke-width="1.4" marker-end="url(#of-arrow-ink)" />
  <path d="M604 471 H652" fill="none" stroke="#1c4e80" stroke-width="1.4" marker-end="url(#of-arrow-ink)" />
  <path d="M604 525 H652" fill="none" stroke="#1c4e80" stroke-width="1.4" marker-end="url(#of-arrow-ink)" />
  <circle cx="604" cy="309" r="2.6" fill="#1c4e80" />
  <circle cx="604" cy="363" r="2.6" fill="#1c4e80" />
  <circle cx="604" cy="417" r="2.6" fill="#1c4e80" />
