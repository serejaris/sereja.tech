  <text x="24" y="604" fill="#94a3b8" font-size="10" font-family="'PT Mono', Menlo, Monaco, Consolas, monospace" letter-spacing="0.14em">ЛЕГЕНДА</text>
  <path d="M108 600 H148" fill="none" stroke="#1c4e80" stroke-width="1.4" />
  <text x="156" y="604" fill="#64748b" font-size="10" font-family="'PT Mono', Menlo, Monaco, Consolas, monospace">задача, ветка и пулреквест</text>
  <path d="M416 600 H456" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4" />
  <text x="464" y="604" fill="#64748b" font-size="10" font-family="'PT Mono', Menlo, Monaco, Consolas, monospace">найм, учёт и чтение</text>

  <text x="24" y="634" fill="#475569" font-size="12" font-family="'PT Mono', Menlo, Monaco, Consolas, monospace">Один список задач на штаб, роли и поверхности общие</text>
</svg>
