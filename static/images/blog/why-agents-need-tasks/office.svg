  <text x="892" y="422" fill="#94a3b8" font-size="9" font-family="'PT Mono', Menlo, Monaco, Consolas, monospace" text-anchor="end" letter-spacing="0.08em">БИЗНЕС</text>

  <rect x="652" y="450" width="256" height="42" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1" />
  <text x="668" y="477" fill="#1e293b" font-size="15" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">Сообщение клиентам</text>
  <text x="892" y="476" fill="#94a3b8" font-size="9" font-family="'PT Mono', Menlo, Monaco, Consolas, monospace" text-anchor="end" letter-spacing="0.08em">БИЗНЕС</text>

  <rect x="652" y="504" width="256" height="42" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1" />
  <text x="668" y="531" fill="#1e293b" font-size="15" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">Пост в канал</text>
  <text x="892" y="530" fill="#94a3b8" font-size="9" font-family="'PT Mono', Menlo, Monaco, Consolas, monospace" text-anchor="end" letter-spacing="0.08em">БИЗНЕС</text>

  <!-- Связи: продюсер в каждую из пяти задач -->
  <path d="M556 417 H604" fill="none" stroke="#1c4e80" stroke-width="1.4" />
  <path d="M604 309 V525" fill="none" stroke="#1c4e80" stroke-width="1.4" />
