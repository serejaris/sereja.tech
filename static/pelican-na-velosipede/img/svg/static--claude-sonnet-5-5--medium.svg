<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="800" height="600">
  <rect width="400" height="300" fill="#dff1fb"/>
  <rect y="245" width="400" height="55" fill="#8fc97a"/>
  <circle cx="340" cy="50" r="28" fill="#ffe27a"/>

  <!-- wheels -->
  <g fill="none" stroke="#222" stroke-width="5">
    <circle cx="110" cy="210" r="42"/>
    <circle cx="290" cy="210" r="42"/>
  </g>
  <g stroke="#666" stroke-width="1.5">
    <line x1="110" y1="168" x2="110" y2="252"/>
    <line x1="68" y1="210" x2="152" y2="210"/>
    <line x1="290" y1="168" x2="290" y2="252"/>
    <line x1="248" y1="210" x2="332" y2="210"/>
  </g>

  <!-- bike frame -->
  <g stroke="#d62828" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="110" y1="210" x2="185" y2="210"/>
    <line x1="110" y1="210" x2="160" y2="140"/>
    <line x1="185" y1="210" x2="160" y2="140"/>
    <line x1="160" y1="140" x2="265" y2="140"/>
    <line x1="185" y1="210" x2="265" y2="140"/>
    <line x1="265" y1="140" x2="290" y2="210"/>
    <line x1="265" y1="140" x2="255" y2="122"/>
  </g>
  <line x1="245" y1="120" x2="270" y2="120" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <line x1="148" y1="136" x2="175" y2="136" stroke="#222" stroke-width="8" stroke-linecap="round"/>
  <circle cx="185" cy="210" r="8" fill="#444"/>

  <!-- tail -->
  <path d="M150 118 L118 108 L124 128 Z" fill="#c9c9c9" stroke="#888" stroke-width="2"/>

  <!-- leg -->
  <g stroke="#f4a300" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M170 128 L200 175 L185 210"/>
  </g>
  <path d="M178 212 L200 212 L196 218 L176 218 Z" fill="#f4a300"/>

  <!-- body -->
  <ellipse cx="185" cy="105" rx="52" ry="34" fill="#f5f5f5" stroke="#999" stroke-width="2" transform="rotate(-10 185 105)"/>
  <path d="M150 100 Q180 120 215 95 Q190 85 150 100 Z" fill="#dcdcdc"/>

  <!-- neck -->
  <path d="M215 95 Q245 90 240 60 Q238 45 250 42" stroke="#f5f5f5" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- wing reaching handlebar -->
  <path d="M195 95 Q235 100 258 120" stroke="#bbb" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="255" cy="42" r="17" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
  <circle cx="260" cy="38" r="4" fill="#fff" stroke="#222" stroke-width="1"/>
  <circle cx="261" cy="38" r="2" fill="#222"/>

  <!-- beak -->
  <path d="M270 40 L332 48 Q334 52 330 54 L270 52 Z" fill="#f4a300" stroke="#c77f00" stroke-width="1.5"/>
  <path d="M270 52 Q300 78 328 56 L270 50 Z" fill="#e8920a" stroke="#c77f00" stroke-width="1.5"/>
</svg>