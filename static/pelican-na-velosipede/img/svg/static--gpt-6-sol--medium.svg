  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican with an orange beak pedals a teal bicycle beneath a pale blue sky.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#d9f3f5"/>
      <stop offset="1" stop-color="#f8f3df"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffcf69"/>
      <stop offset="1" stop-color="#f19a43"/>
    </linearGradient>
    <linearGradient id="frame" x2="0" y2="1">
      <stop stop-color="#168a91"/>
      <stop offset="1" stop-color="#08616e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <style>
      .line{fill:none;stroke-linecap:round;stroke-linejoin:round}
      .spoke{stroke:#6c8790;stroke-width:3;opacity:.75}
    </style>
  </defs>

