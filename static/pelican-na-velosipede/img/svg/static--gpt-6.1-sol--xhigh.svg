<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" stroke-opacity="1" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican with a long golden bill, red cycling cap, and fluttering scarf pedals a turquoise bicycle beside the sea.</desc>
