      <stop stop-color="#fbf4e7"/>
      <stop offset="1" stop-color="#f5ead8"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f9bc62"/>
      <stop offset="1" stop-color="#ed9865"/>
    </linearGradient>
    <g id="wheel">
